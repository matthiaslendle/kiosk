<div class="counter">
  <app-customer-picker [clearEvent]="clearEventSubjet.asObservable()" />

  @if (selectedCustomer) {
  <div>
    <app-keyvalues [sum]="cartSum$ | async" [credit]="credit$ | async" />
  </div>
  }

  <div class="shelf">
    <app-shelf />
  </div>

  <app-cart />

  <button mat-raised-button [color]="(overdrawn$ | async) ? 'warn' : 'primary'" (click)="submit()">
    {{ (overdrawn$ | async) ? 'Überzogen' : 'Buchen' }}
  </button>
</div>
