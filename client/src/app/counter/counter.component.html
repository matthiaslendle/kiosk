<div class="counter">
  <app-customer-picker
    [clearEvent]="clearEventSubjet.asObservable()"
  ></app-customer-picker>

  @if (selectedCustomer) {
  <div>
    <app-keyvalues [sum]="cartSum$ | async" [credit]="credit$ | async">
    </app-keyvalues>
  </div>
  }

  <div class="shelf">
    <app-shelf></app-shelf>
  </div>

  <app-cart></app-cart>

  <button
    mat-raised-button
    [color]="(overdrawn$ | async) ? 'warn' : 'primary'"
    (click)="submit()"
  >
    {{ (overdrawn$ | async) ? 'Überzogen' : 'Buchen' }}
  </button>
</div>
