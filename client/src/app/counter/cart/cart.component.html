<mat-card class="cart">
  <mat-card-title>Einkaufskorb ({{ cartSum$ | async | currency }})</mat-card-title>
  <div class="items">
    <div *ngFor="let item of cart$ | async">
      <app-cart-item [item]="item" (changeQuantity)="onQuantityChange()">
      </app-cart-item>
    </div>
  </div>
</mat-card>
