<mat-card class="cart">
  <mat-card-title
    >Einkaufskorb ({{ cartSum$ | async | currency }})</mat-card-title
  >
  <div class="items">
    @for (item of cart$ | async; track item) {
    <div>
      <app-cart-item [item]="item" (changeQuantity)="onQuantityChange()">
      </app-cart-item>
    </div>
    }
  </div>
</mat-card>
